name: Deploy Worker

# main    -> live app (nadu-wedding, database nadu-wedding-db)
# staging -> test copy (nadu-wedding-staging, database nadu-wedding-staging-db)
on:
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: ${{ github.ref_name == 'staging' && 'deploy --env staging' || 'deploy' }}
