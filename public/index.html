<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nadu Wedding Planner</title>
<meta name="description" content="둘이 함께 쓰는 결혼·신혼집 예산 플래너 · A wedding & first-home budget planner for two">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: names + countdown hero, sticky top tabs, one panel per job; rose & gold on blush paper (from the couple's tracker) */
:root {
  --bg: #fbf8f9; --surface: #ffffff; --sunk: #f4edf0; --ink: #2b1e2a; --muted: #7d6b78; --faint: #b7a8b2; --line: #eadfe4;
  --accent: #b8466e; --accent-soft: #f6e1e9; --gold: #9a7630; --gold-soft: #f4ecda;
  --bad: #b23a3a; --bad-soft: #f9e3e1; --warn: #a86412; --warn-soft: #fbebd6; --good: #3f7a5a; --good-soft: #e1f0e7;
  --c-down: #c9bcc5; --c-fixed: #7a4e8c; --c-food: #b48bc4; --c-nv: #b98d3a; --c-move: #6f8fa8; --c-hs: #d9895b; --c-left: #3f7a5a;
  --display: "Gowun Batang", "Nanum Myeongjo", Georgia, serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px; --r-sm: 8px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171215; --surface: #211a1f; --sunk: #2a2128; --ink: #f2e9ee; --muted: #b3a1ad; --faint: #6e5f69; --line: #352b33;
  --accent: #e88aac; --accent-soft: #3a2330; --gold: #d6b26a; --gold-soft: #342b1c;
  --bad: #f08a80; --bad-soft: #3a2020; --warn: #e9b062; --warn-soft: #3a2d1a; --good: #7cc39b; --good-soft: #1d3327;
  --c-down: #5a4c56; --c-fixed: #a77bbb; --c-food: #cfaedd; --c-nv: #d6b26a; --c-move: #8fb0c9; --c-hs: #eba57d; --c-left: #7cc39b; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #171215; --surface: #211a1f; --sunk: #2a2128; --ink: #f2e9ee; --muted: #b3a1ad; --faint: #6e5f69; --line: #352b33;
  --accent: #e88aac; --accent-soft: #3a2330; --gold: #d6b26a; --gold-soft: #342b1c;
  --bad: #f08a80; --bad-soft: #3a2020; --warn: #e9b062; --warn-soft: #3a2d1a; --good: #7cc39b; --good-soft: #1d3327;
  --c-down: #5a4c56; --c-fixed: #a77bbb; --c-food: #cfaedd; --c-nv: #d6b26a; --c-move: #8fb0c9; --c-hs: #eba57d; --c-left: #7cc39b; color-scheme: dark; }
/* Bright skin: pure white, clearer rose and stronger category colors */
:root[data-skin="bright"], :root[data-skin="bright"]:not([data-theme="light"]) {
  --bg: #ffffff; --surface: #ffffff; --sunk: #fbf0f4; --ink: #1f1320; --muted: #6b5867; --faint: #c2aebb; --line: #f0dfe6;
  --accent: #d2336b; --accent-soft: #fde3ec; --gold: #b0841f; --gold-soft: #fbf0d5;
  --bad: #d62f2f; --bad-soft: #fde4e2; --warn: #c97200; --warn-soft: #fff0d9; --good: #138a55; --good-soft: #dcf5e8;
  --c-down: #d4c4ce; --c-fixed: #7d3fd0; --c-food: #b48cff; --c-nv: #f0a92a; --c-move: #2f8fd8; --c-hs: #ff7a45; --c-left: #138a55; color-scheme: light; }

/* Bright skin: pastel controls instead of solid ink */
:root[data-skin="bright"] .seg { background: var(--sunk); border-color: var(--line); }
:root[data-skin="bright"] .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: 0 1px 2px rgba(210, 51, 107, .12); }
:root[data-skin="bright"] button.primary { background: var(--accent-soft); border-color: #f7c6d8; color: var(--accent); font-weight: 600; }
:root[data-skin="bright"] button.primary:hover { background: #fbd3e1; opacity: 1; }
:root[data-skin="bright"] button.danger { background: #fff1f0; color: var(--bad); }
:root[data-skin="bright"] .chipbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
:root[data-skin="bright"], :root[data-skin="bright"] * { scrollbar-color: #f2b8cc #fbf0f4; }
:root[data-skin="bright"] ::-webkit-scrollbar { width: 10px; height: 10px; }
:root[data-skin="bright"] ::-webkit-scrollbar-track { background: #fbf0f4; border-radius: 999px; }
:root[data-skin="bright"] ::-webkit-scrollbar-thumb { background: #f2b8cc; border-radius: 999px; border: 2px solid #fbf0f4; }
:root[data-skin="bright"] ::-webkit-scrollbar-thumb:hover { background: #ea9bb8; }
:root[data-skin="bright"] ::-webkit-scrollbar-corner { background: transparent; }
:root[data-skin="bright"] .toast { background: var(--accent-soft); color: var(--accent); border: 1px solid #f7c6d8; font-weight: 600; }
:root[data-skin="bright"] .tip { box-shadow: 0 6px 18px rgba(210, 51, 107, .14); }
:root[data-skin="bright"] input[type=checkbox], :root[data-skin="bright"] input[type=radio] { accent-color: var(--accent); }

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 64rem; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.15; margin-top: 6px; }
h1 .amp { color: var(--accent); font-weight: 400; }
h2 { font-size: 20px; }
h3 { font-size: 15px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.mono, input.money, td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.small { font-size: 13px; color: var(--muted); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: flex-start; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font-size: 13.5px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 6px 14px; cursor: pointer; }
button:hover { border-color: var(--faint); }
button.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
button.primary:hover { opacity: .9; }
button.ghost { border-color: transparent; background: transparent; color: var(--faint); padding: 3px 7px; }
button.ghost:hover { color: var(--bad); }
button.danger, button.ghost.danger { border-color: transparent; color: var(--bad); background: var(--bad-soft); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

/* countdown hero */
.hero { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 28px; align-items: end; padding-block: 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.count { font-family: var(--display); font-size: clamp(56px, 14vw, 96px); line-height: .9; color: var(--accent); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.count small { display: block; font-family: var(--body); font-size: 13px; color: var(--muted); letter-spacing: 0; margin-top: 10px; }
.meta { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.field input { width: auto; }
.prog { display: flex; flex-direction: column; gap: 6px; }
.prog-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog-row b { color: var(--ink); font-weight: 600; }
.pbar { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.pbar.done i { background: var(--good); }

/* tabs */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); margin-inline: -16px; padding-inline: 16px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: none; border: 0; border-radius: 0; background: none; padding: 12px 12px 10px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.tabpanel { display: flex; flex-direction: column; gap: 32px; }
.off { display: none !important; }

section { display: flex; flex-direction: column; gap: 14px; }
.sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 16px; align-items: start; }

/* inputs */
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label.f .hint { font-family: var(--mono); font-size: 11.5px; color: var(--accent); min-height: 1.1em; }
input, select, textarea { color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 7px 10px; min-width: 0; width: 100%; font-size: 14px; }
input.money { text-align: right; }
input[type=date] { font-family: var(--mono); }
.derived { background: var(--sunk); border-radius: var(--r-sm); padding: 7px 10px; font-family: var(--mono); text-align: right; font-size: 14px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 12.5rem), 1fr)); gap: 14px 16px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); cursor: pointer; }
.check input { width: auto; accent-color: var(--accent); }

/* tiles */
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr)); gap: 12px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-family: var(--display); font-size: 28px; line-height: 1.2; color: var(--accent); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.v.bad { color: var(--bad); } .v.good { color: var(--good); }
button.stat { text-align: left; cursor: pointer; font: inherit; color: inherit; }
button.stat:hover { border-color: var(--accent); }

/* breakdown chart */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend .mk { display: inline-block; width: 0; height: 12px; border-left: 2px dashed var(--ink); margin-right: 6px; vertical-align: -2px; }
.legend .mk.g { border-left-style: dotted; border-color: var(--accent); }
.bk { position: relative; display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.bk-row { display: grid; grid-template-columns: minmax(0, 10rem) minmax(0, 1fr) minmax(0, 7.5rem); gap: 12px; align-items: center; }
.bk-row .nm { font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
.bk-row .nm small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.bk-track { position: relative; height: 24px; background: var(--sunk); border-radius: 6px; }
.bk-seg { position: absolute; top: 0; bottom: 0; }
.bk-seg:first-child { border-radius: 6px 0 0 6px; }
.bk-seg.short { background: repeating-linear-gradient(45deg, var(--bad) 0 4px, transparent 4px 8px); border: 1px solid var(--bad); }
.bk-mark { position: absolute; top: -4px; bottom: -4px; border-left: 2px dashed var(--ink); pointer-events: none; }
.bk-mark.g { border-left: 2px dotted var(--accent); }
.bk-row .res { text-align: right; font-family: var(--mono); font-size: 13px; }
.bk-row .res small { display: block; font-family: var(--body); color: var(--muted); font-size: 11px; }
.bk-row.off-row { opacity: .45; }
.tip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); box-shadow: 0 6px 18px rgba(43, 30, 42, .14); padding: 6px 10px; font-size: 12.5px; z-index: 20; display: none; max-width: 16rem; }
.tip b { font-family: var(--mono); font-weight: 500; }
@media (max-width: 600px) { .bk-row { grid-template-columns: minmax(0, 1fr) auto; } .bk-track { grid-column: 1 / -1; order: 3; } }

/* tables */
.scroll { overflow-x: auto; }
.panel.scroll { padding: 0; }
.panel.scroll > h3 { padding: 14px 16px 0; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: right; vertical-align: middle; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .04em; background: var(--sunk); }
th.l, td.l { text-align: left; }
td.wrap-cell { white-space: normal; min-width: 10rem; color: var(--muted); }
td.neg, .neg { color: var(--bad); }
.pos { color: var(--good); }
tr.sel td { background: var(--accent-soft); }
tr.off-row td { color: var(--muted); }
tr.tot td { font-weight: 600; background: var(--sunk); }
td.empty-row { color: var(--muted); text-align: center; padding: 22px 12px; white-space: normal; }
.chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; background: var(--sunk); color: var(--muted); }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); } .chip.best, .chip.rose { background: var(--accent-soft); color: var(--accent); }
.chip.plan { background: var(--gold-soft); color: var(--gold); }
.vname { font-weight: 500; }
.rowacts { display: flex; gap: 2px; justify-content: flex-end; }
.rowacts button { font-size: 12.5px; padding: 3px 8px; border: 0; background: none; color: var(--muted); }
.rowacts button:hover { color: var(--accent); }
tr.best td.fin { color: var(--good); font-weight: 600; }
tr.picked td:first-child { box-shadow: inset 3px 0 0 var(--accent); }

/* editor cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 21rem), 1fr)); gap: 14px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.card-head { display: flex; gap: 6px; align-items: center; }
.card-head input.title { font-family: var(--display); font-weight: 700; font-size: 17px; background: transparent; border-color: transparent; padding: 2px 4px; }
.card-head input.title:hover, .card-head input.title:focus { border-color: var(--line); background: var(--bg); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 6.5rem), 1fr)); gap: 8px; }
.lines { display: flex; flex-direction: column; gap: 6px; }
.line { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 9rem) auto; gap: 6px; align-items: center; }
.line.hs { grid-template-columns: minmax(0, 1fr) minmax(0, 8rem) auto auto; }
.line.hs.prov input.money { opacity: .45; text-decoration: line-through; }
.line.eb { grid-template-columns: minmax(0, 1fr) minmax(0, 11rem) minmax(0, 9rem) auto; }
@media (max-width: 560px) { .line.eb { grid-template-columns: minmax(0, 1fr) minmax(0, 8rem) auto; } .line.eb select { grid-column: 1 / -1; grid-row: 2; } }
.card-foot { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: space-between; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; font-size: 12.5px; color: var(--muted); }
.card-foot b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cat-type { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.cat-type select { width: auto; }
.extra-budget { margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.eb-head { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }

/* folding */
.fold { border: 0; background: transparent; padding: 2px 6px; color: var(--faint); font-size: 14px; line-height: 1; flex: none; }
.fold:hover { color: var(--accent); }
.fold::before { content: "▾"; display: inline-block; transition: transform .15s; }
.collapsed .fold::before { transform: rotate(-90deg); }
.fold-sum { display: none; font-family: var(--mono); font-size: 13px; color: var(--accent); white-space: nowrap; }
.collapsed .fold-sum { display: inline; }
.sec-head .ttl { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.sec-head .ttl .fold-sum { margin-left: 8px; }
section.collapsed > :not(.sec-head) { display: none !important; }
section.collapsed .sec-head > :not(.ttl) { display: none; }
.card.collapsed > :not(.card-head) { display: none !important; }
.card.collapsed { gap: 0; }

/* cash walk */
.walk { display: flex; flex-direction: column; gap: 6px; }
.step { display: grid; grid-template-columns: minmax(0, 13rem) minmax(0, 1fr) minmax(0, 8.5rem); gap: 12px; align-items: center; font-size: 13.5px; }
.step .track { position: relative; height: 14px; }
.step .sb { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--c-down); }
.step.total .sb { background: var(--accent); } .step.plus .sb { background: var(--good); } .step.bad .sb { background: var(--bad); }
.step .amt { text-align: right; font-family: var(--mono); }
.step.total .amt, .step.total .lab { font-weight: 600; }
@media (max-width: 560px) { .step { grid-template-columns: minmax(0, 1fr) auto; } .step .track { grid-column: 1 / -1; order: 3; } }

/* checklist */
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chipbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chipbtn[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.chipbtn .n { margin-left: 6px; color: var(--faint); }
.chipbtn.late .n { color: var(--bad); }
.stages { display: flex; flex-direction: column; }
.stage { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 24px; padding-block: 22px; border-bottom: 1px solid var(--line); }
.stage .when { display: flex; flex-direction: column; gap: 2px; }
.dlabel { font-family: var(--mono); font-size: 22px; letter-spacing: -.01em; }
.stage.past .dlabel { color: var(--faint); }
.stage.now .dlabel { color: var(--accent); }
.whensub { font-size: 12px; color: var(--muted); }
.whendate { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 4px; }
.pill { align-self: flex-start; margin-top: 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.pill.late { background: var(--bad-soft); color: var(--bad); }
.cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.col h3 { margin: 0 0 8px; font-family: var(--body); font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.col.empty { display: none; }
ul.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.item { display: flex; align-items: flex-start; gap: 10px; padding: 6px; margin-inline: -6px; border-radius: var(--r-sm); }
.item:hover { background: var(--sunk); }
input.ck { appearance: none; flex: none; width: 18px; height: 18px; padding: 0; margin: 2px 0 0; border: 1.5px solid var(--faint); border-radius: 5px; background: var(--surface); cursor: pointer; display: grid; place-content: center; }
input.ck:checked { background: var(--accent); border-color: var(--accent); }
input.ck:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid var(--bg); border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.item label { flex: 1; min-width: 0; cursor: pointer; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.item .t { overflow-wrap: anywhere; }
.item.done .t { color: var(--faint); text-decoration: line-through; }
.item.late:not(.done) .t { color: var(--bad); }
.key { font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); }
.mine { font-size: 10.5px; color: var(--faint); }
.stip { margin-top: 10px; font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
.stip b { flex: none; font-size: 10px; letter-spacing: .08em; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 5px; margin-top: 2px; }
.adder { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; }
.adder input { flex: 1 1 200px; width: auto; background: transparent; border: 0; border-bottom: 1px dashed var(--line); border-radius: 0; padding: 6px 2px; font-size: 13.5px; }
.adder select { width: auto; font-size: 12.5px; padding: 4px 6px; color: var(--muted); }
.adder button { font-size: 12.5px; padding: 4px 12px; }
.hidefilter .stage.nomatch { display: none; }
.upnext { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.upnext li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.upnext li:last-child { border-bottom: 0; }
.upnext .d { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.upnext li.late .t { color: var(--bad); }
.mini { display: flex; align-items: center; gap: 8px; min-width: 110px; }
.mini .pbar { flex: 1; }

/* entry forms */
form.entry { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 9.5rem), 1fr)); gap: 10px 12px; align-items: end; }
form.entry label.f.wide { grid-column: span 2; }
form.entry .acts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
form.entry .check { padding-bottom: 8px; }
form.entry.editing { border-color: var(--accent); }
form.entry .split-f.hide { display: none; }
.searchrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.searchrow input { flex: 1 1 200px; width: auto; }
.searchrow select { width: auto; }
.ratio { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.ratio input { text-align: right; font-family: var(--mono); }
.transfers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.transfers li { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.transfers b { font-family: var(--mono); font-weight: 500; }
@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; gap: 18px; }
  .stage { grid-template-columns: 1fr; gap: 14px; }
  .stage .when { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .pill { margin-top: 0; }
  .cols { grid-template-columns: 1fr; gap: 14px; }
  .adder { grid-column: 1; }
  .ratio { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  form.entry label.f.wide { grid-column: 1 / -1; }
}

/* import/export, toast */
.io textarea { font-family: var(--mono); font-size: 12px; min-height: 9rem; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r-sm); font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
.toast.on { opacity: 1; }

/* report */
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px; display: flex; flex-direction: column; gap: 22px; }
.report-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.rep-opts { display: flex; flex-direction: column; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.rep-opts .grp { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.rep-opts .grp > span:first-child { font-size: 12px; color: var(--muted); min-width: 7rem; }
.report h2 { font-size: 26px; }
.report h3 { border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.report .meta-line { color: var(--muted); font-size: 13px; }
.report .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr)); gap: 4px 20px; font-size: 13.5px; }
.report .kv div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); padding: 3px 0; }
.report .kv span:last-child { font-family: var(--mono); }
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 19rem), 1fr)); gap: 14px; }
.opt { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; break-inside: avoid; }
.opt h4 { font-family: var(--display); margin: 0 0 6px; font-size: 16px; }
.opt table td, .opt table th { padding: 3px 4px; font-size: 12.5px; }
.opt tr.tot td { border-top: 1px solid var(--ink); }
.report table th, .report table td { white-space: normal; }

/* staging marker: impossible to mistake the test copy for the real one */
.env-banner { position: sticky; top: 0; z-index: 50; background: repeating-linear-gradient(135deg, #f2c94c 0 14px, #f7dc7a 14px 28px); color: #3b2a00; text-align: center; font: 600 13px/1.4 var(--body); letter-spacing: .04em; padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
.gate .env-banner { position: absolute; top: 0; left: 0; right: 0; }
@media print { .env-banner { display: none !important; } }
/* plans, settings, admin */
.plan-bar { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.plan-bar select { width: auto; font-size: 12.5px; padding: 3px 8px; }
.ro-banner { background: var(--warn-soft); color: var(--warn); border-radius: var(--r-sm); padding: 10px 14px; font-size: 13.5px; }
.settings-body { display: flex; flex-direction: column; gap: 16px; }
.kvline { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13.5px; border-top: 1px solid var(--line); padding-top: 8px; }
.kvline span { color: var(--muted); }
.invite-out { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; margin-top: 6px; }
.invite-out .small { grid-column: 1 / -1; margin: 0; }
.invite-code { font-size: 22px; letter-spacing: .08em; color: var(--accent); }
.invite-link { font-family: var(--mono); font-size: 12px; }
.danger-zone { border-color: var(--bad-soft); }
.warn-text { color: var(--warn); }
.onboard { display: flex; flex-direction: column; gap: 12px; }
.ob-card { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.gate-card .amp { color: var(--accent); font-weight: 400; }
.gate-tag { margin: -6px 0 0; }
.gate-links { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.gate-msg { color: var(--good); margin: 0; }
.privacy-text { background: var(--sunk); border-radius: var(--r-sm); padding: 10px; margin: 6px 0 0; line-height: 1.6; }
.gate-lang { align-self: center; }
body.readonly .tabpanel:not([data-panel="settings"]):not([data-panel="admin"]) :is(input, select, textarea):disabled { background: var(--sunk); color: var(--ink); opacity: 1; }
/* sign-in gate & sync status */
.gate { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); overflow-y: auto; }
.gate-card { width: min(100%, 24rem); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
.gate-card h1 { font-size: 30px; margin: 0; }
.gate-card h2 { font-size: 17px; color: var(--muted); font-family: var(--body); font-weight: 500; }
.gate-err { color: var(--bad); font-size: 13px; min-height: 1.2em; margin: 0; }
.gate-card button.primary { padding: 9px 14px; }
button.link { border: 0; background: none; color: var(--accent); padding: 0; font-size: 13px; text-align: left; }
body.gated .wrap { visibility: hidden; }
.userbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12.5px; color: var(--muted); justify-content: flex-end; }
.userbar .who { font-weight: 600; color: var(--ink); }
.userbar .who::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.sync.bad { color: var(--bad); }
.userbar button { font-size: 12.5px; padding: 3px 10px; }
#export-btns button { font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { .toast, .pbar i, .fold::before { transition: none; } }
@media print {
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"], :root[data-skin="bright"] { --bg: #fff; --surface: #fff; --sunk: #f6f0f3; --ink: #111; --muted: #555; --line: #ddd; --accent: #b8466e; --accent-soft: #f6e1e9; color-scheme: light; }
  body { background: #fff; }

  #report-sec { display: flex !important; }
  .report { border: 0; padding: 0; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .opt, .bk-row, tr { break-inside: avoid; }
}

  // ---------- model ----------
  function model() {
    const B = S.budget;
    const cats = (S.categories || []).map((c) => ({ c, total: c.lines.reduce((a, x) => a + n(x.amount), 0) }));
    const catWed = cats.filter((x) => x.c.type !== 'movein').reduce((a, x) => a + x.total, 0);
    const catMove = cats.filter((x) => x.c.type === 'movein').reduce((a, x) => a + x.total, 0);
    const nvBase = S.nonVenue.reduce((a, x) => a + n(x.amount), 0);
    const nvTotal = nvBase + catWed;
    const broker = n(B.deposit) * n(B.brokerRate) / 100 * (B.brokerVat ? 1.1 : 1);
    const acBase = S.afterCosts.reduce((a, x) => a + n(x.amount), 0) + broker;
    const acTotal = acBase + catMove;
    const hsTotal = (S.honsu || []).filter((x) => !x.provided).reduce((a, x) => a + n(x.amount), 0);
    const hsSaved = (S.honsu || []).filter((x) => x.provided).reduce((a, x) => a + n(x.amount), 0);
    const loan = S.loans.find((l) => l.id === S.selectedLoan);
    const loanAmt = loan ? Math.min(n(B.loan), n(loan.limit) || n(B.loan)) : n(B.loan);
    const loanGap = n(B.loan) - loanAmt;
    const down = n(B.deposit) - n(B.loan) + loanGap;
    const extras = (B.extras || []).map((e) => ({ e, signed: (e.kind === 'sub' ? -1 : 1) * n(e.amount) }));
    const cashTotal = n(B.cash) + extras.reduce((a, x) => a + x.signed, 0);
    const avail = cashTotal - down;
    const t = B.tier, g = n(B.guests);
    const venues = S.venues.map((v) => {
      const fixed = v.lines.reduce((a, x) => a + n(x.amount), 0);
      const billed = Math.max(g, n(v.minGuests));
      const food = billed * n(v.food);
      const venueTotal = fixed + food, total = venueTotal + nvTotal;
      const gifts = B.gifts.map((p) => g * n(p));
      const nets = gifts.map((x) => total - x), surpl = nets.map((x) => avail - x);
      let status = 'ok', why = T('fits');
      if ((n(v.capMin) && g < n(v.capMin)) || (n(v.capMax) && g > n(v.capMax))) { status = 'bad'; why = `${T('cap')} ${n(v.capMin) || 0}–${n(v.capMax) || '∞'}`; }
      else if (!v.lines.length) { status = 'warn'; why = T('noQuote'); }
      else if (surpl[t] < 0) { status = 'bad'; why = T('over'); }
      else if (surpl[t] - acTotal < 0) { status = 'warn'; why = T('shortMove'); }
      else if (surpl[t] - acTotal - hsTotal < 0) { status = 'warn'; why = T('shortHonsu'); }
      return { v, fixed, billed, food, unused: (billed - g) * n(v.food), venueTotal, total, gifts, nets, surpl, gift: gifts[t], net: nets[t], surplus: surpl[t], honsu: surpl[t] - acTotal, honsus: surpl.map((x) => x - acTotal), final: surpl[t] - acTotal - hsTotal, finals: surpl.map((x) => x - acTotal - hsTotal), status, why };
    });
    const inc = venues.filter((x) => x.v.include !== false);
    const best = inc.filter((x) => x.status !== 'bad' && x.v.lines.length).sort((a, b) => b.surplus - a.surplus)[0];
    const sel = venues.find((x) => x.v.id === S.selectedVenue) || best || venues[0];
    return { extras, cashTotal, cats, nvBase, acBase, nvTotal, broker, acTotal, hsTotal, hsSaved, down, avail, loan, loanAmt, loanGap, venues, inc, best, sel };
  }

    }
  }

  // ---------- boot ----------
  function showEnv(name) {
    if (name !== 'staging') return;
    $('env-banner').hidden = false;
  }
  async function boot() {
    loadPrefs(); ensureShape(); renderAll();
    const q = new URLSearchParams(location.search);
    if (q.get('join')) { try { sessionStorage.setItem('nadu-join', q.get('join')); } catch (e) {} history.replaceState(null, '', location.pathname); }
    const er = await api('/env'); if (er.ok) Object.assign(ENV, er.data);
    showEnv(ENV.env); applyPlanNames();
    if (q.get('reset')) { resetToken = q.get('reset'); showGate('reset'); return; }
    const r = await api('/me');
    if (r.ok) afterSignIn(); else showGate(q.get('join') ? 'signup' : 'login');
  }

  // ---------- history tab ----------
  let histRows = [], histDone = false;
  async function renderHistory(reset = true) {
    if (!Sync.me) return;
    if (reset) { histRows = []; histDone = false; }
    const before = histRows.length ? histRows[histRows.length - 1].id : 0;
    const r = await api('/history?limit=50' + (before ? '&before=' + before : ''));
    if (!r.ok) return;
    Sync.users = r.data.users || Sync.users;
    histRows = histRows.concat(r.data.rows); histDone = r.data.rows.length < 50;
    const tbl = $('hist-table'); tbl.innerHTML = '';
    thead(tbl, [[T('hWhen'), 'l'], [T('hWho'), 'l'], [T('hWhat'), 'l'], [T('hAct'), 'l'], [T('hVer')], ['']]);
    const tb = el('tbody');
    if (!histRows.length) emptyRow(tb, 6, T('histEmpty'));
    histRows.forEach((h) => {
      const b = el('button', { type: 'button', text: T('restoreL'), disabled: !(Sync.plan && Sync.plan.writable) });
      b.addEventListener('click', async () => {
        if (!b.dataset.arm) { b.dataset.arm = '1'; b.textContent = T('restoreQ'); b.classList.add('danger'); setTimeout(() => { if (b.isConnected) { delete b.dataset.arm; b.textContent = T('restoreL'); b.classList.remove('danger'); } }, 3000); return; }
        clearTimeout(Sync.timer); await flush();
        const rr = await api('/restore', { method: 'POST', body: { id: h.id } });
        if (rr.ok) { toast(T('restored')); await poll(); renderHistory(true); } else toast(T('stError'));
      });
      const d = new Date(h.at);
      tb.append(el('tr', {},
        el('td', { class: 'l mono', text: d.toLocaleString(S.lang === 'ko' ? 'ko-KR' : 'en-CA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }), title: h.at }),
        el('td', { class: 'l', text: Sync.users[h.user_id] || '—' }),
        el('td', { class: 'l vname', text: T('keyLabels')[h.key] || h.key }),
        el('td', { class: 'l' }, el('span', { class: 'chip ' + (h.action === 'restore' ? 'plan' : h.action === 'import' ? 'rose' : ''), text: T({ edit: 'aEdit', restore: 'aRestore', import: 'aImport' }[h.action] || 'aEdit') })),
        el('td', { class: 'n', text: 'v' + h.version }),
        el('td', {}, el('div', { class: 'rowacts' }, b))));
    });
    tbl.append(tb);
    $('hist-more').hidden = histDone;
  }

  // ---------- exports ----------
  function download(name, text, type) {
    const blob = new Blob([text], { type }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  const csvCell = (v) => { const s = v == null ? '' : String(v); return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = (head, rows) => '﻿' + [head, ...rows].map((r) => r.map(csvCell).join(',')).join('\r\n'); // BOM so Excel reads Korean
  const stamp = () => new Date().toISOString().slice(0, 10);
  const EXPORTS = {
    json: () => { location.href = '/api/export?plan=' + Sync.planId; },
    exp: () => download(`expenses-${stamp()}.csv`, csv([T('fCat'), T('fItem'), T('fAmt'), T('fStatus'), T('fPaidBy'), T('fMemo')],
      S.expenses.map((x) => [cname(x.cat), x.name, n(x.amount), x.status === 'paid' ? T('expPaid') : T('expPlanned'), pname(x.paidBy), x.memo || ''])), 'text/csv'),
    guests: () => download(`guests-${stamp()}.csv`, csv([T('fName'), T('fSide'), T('fGroup'), T('fCount'), T('fAttend'), T('fMemo')],
      S.guests.map((x) => [x.name, x.side === 'b' ? T('sideB') : T('sideG'), x.group || '', Math.max(1, n(x.count)), T({ yes: 'aYes', maybe: 'aMaybe', no: 'aNo' }[x.status] || 'aMaybe'), x.memo || ''])), 'text/csv'),
    gifts: () => download(`gift-money-${stamp()}.csv`, csv([T('fName'), T('fSide'), T('fAmt'), T('fMemo'), T('thanked')],
      S.giftLog.map((x) => [x.name, x.side === 'b' ? T('sideB') : T('sideG'), n(x.amount), x.memo || '', x.thanked ? 'Y' : ''])), 'text/csv'),
    vendors: () => download(`vendors-${stamp()}.csv`, csv([T('fCat'), T('fVendor'), T('fQuote'), T('fFinal'), T('fMemo'), T('pickedL')],
      S.vendors.map((v) => [cname(v.cat), v.name, n(v.quote), n(v.final), v.memo || '', v.picked ? 'Y' : ''])), 'text/csv'),
    hist: async () => {
      let rows = [], before = 0;
      for (let i = 0; i < 20; i++) { const r = await api('/history?limit=200' + (before ? '&before=' + before : '')); if (!r.ok || !r.data.rows.length) break; rows = rows.concat(r.data.rows); Sync.users = r.data.users || Sync.users; before = r.data.rows[r.data.rows.length - 1].id; if (r.data.rows.length < 200) break; }
      download(`history-${stamp()}.csv`, csv([T('hWhen'), T('hWho'), T('hWhat'), T('hAct'), T('hVer')],
        rows.map((h) => [h.at, Sync.users[h.user_id] || '', T('keyLabels')[h.key] || h.key, h.action, h.version])), 'text/csv');
    }
  };
  function renderExportButtons() {
    const box = $('export-btns'); if (!box) return; box.innerHTML = '';
    [['backup', 'exBackup'], ['json', 'exJson'], ['exp', 'exExp'], ['guests', 'exGuests'], ['gifts', 'exGifts'], ['vendors', 'exVendors'], ['hist', 'exHist']].forEach(([k, lab]) => {
      const b = el('button', { type: 'button', text: T(lab) }); b.addEventListener('click', EXPORTS[k]); box.append(b);
    });
  }
  $('hist-more').addEventListener('click', () => renderHistory(false));

  function renderAll() { ensurePrep(); applyLang(); renderTabs(); setupFolds(); renderBudget(); renderExtras(); renderVenues(); renderShared(); renderLoans(); if (forms.lang !== S.lang) renderPrepForms(); renderSearchRows(); renderRatio(); renderExportButtons(); compute(); renderHeader(); renderPresence(); renderPlanBar(); applyTab(); applyReadonly(); }
  boot();
})();
</script>
</body>
</html>
